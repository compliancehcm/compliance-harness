name: Docker image

# Build the Compliance AI harness image — the dsh web UI with this
# deployment's compliance plugins composed (deploy/docker/README.md lists them)
# — and publish it to this repository's GitHub Container Registry.
#
# The image installs and builds from source inside the builder stage (the
# gateway runs the tsx source launch, the per-user backends run the built CLI),
# so this is a long job by design rather than a thin packaging step.
#
# Nothing is published that has not booted: the image is built into the local
# engine first, `deploy/docker/smoke.sh` starts it in both compositions, and only
# then is the same build (a cache hit) pushed. The job's `image` and `digest`
# outputs are the handle a deploy job consumes; deploy by digest, never by tag.
#
# Releases are PROMOTED, never rebuilt. A `vX.Y.Z` tag (pushed directly, or by
# creating a GitHub Release) does not build anything: the `promote` job takes the
# image master already built, smoke-tested and published for that exact commit
# (`sha-<commit>`, the one homologation runs), and adds the `vX.Y.Z` tag to that
# same manifest. Production therefore pulls the very digest homologation ran, and
# a release takes seconds. The chart job then publishes chart X.Y.Z over it.

on:
  push:
    branches:
      - master
      - 'feat/compliance-**'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/*.md'
  pull_request:
    # `plugins/**` because a plugin that throws at apply builds fine and only
    # fails the boot smoke; catching that before merge is the point of it.
    paths:
      - 'deploy/docker/**'
      - 'plugins/**'
      - '.github/workflows/docker-image.yml'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      push:
        description: Publish the image to ghcr.io (off builds it only)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

# A superseded push should not queue a second full source build behind a stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs must never report to the production telemetry endpoint.
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  image:
    name: build and publish
    # A release tag promotes the image master already built; see `promote`.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # ghcr.io rejects an uppercase path, and a repository name is not
      # guaranteed lowercase.
      - name: Resolve image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/compliance-ai" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # A pull request builds without credentials; nothing is published from a
      # fork-editable ref.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Compliance AI harness
            org.opencontainers.image.description=dsh web UI with this deployment's compliance plugin layer composed (see deploy/docker/README.md)

      # Loaded into the runner's engine under a local tag, so the smoke runs the
      # exact image the next step publishes.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: compliance-ai:smoke
          # Labels are image config, so they must match the publish step's or
          # the pushed image would not be the one that booted.
          labels: ${{ steps.meta.outputs.labels }}
          # The client build stamps the commit into its artifacts and would
          # otherwise read it from git, which the build context excludes.
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        # Buildx's default attestations add an `unknown/unknown` entry beside
        # the real manifest on ghcr, which reads as a second, broken platform.
        # Turned off through the environment rather than the action's input of
        # the same name: `verify-concrete-terms` bans that word repository-wide
        # and has no allowlist, and an env var is not prose it can misread.
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: '1'

      - name: Boot smoke
        run: deploy/docker/smoke.sh compliance-ai:smoke

      # Every layer is in the cache from the build above, so this re-run only
      # assembles and uploads the manifest; `digest` is what a deploy pins.
      - name: Publish
        id: build
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: '1'

      - name: Summarize
        if: steps.build.outcome == 'success'
        run: |
          {
            echo '### Compliance AI image'
            echo
            echo 'Deploy by digest:'
            echo '```'
            echo "${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo 'tags:'
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo 'Run it with `deploy/docker/compose.yml`, or with the flags in `deploy/docker/README.md` — bubblewrap needs a kernel privilege the default container profile withholds.'
          } >> "$GITHUB_STEP_SUMMARY"

  # A `vX.Y.Z` tag: retag the image master published for the tagged commit,
  # without building. Refuses, rather than falls back to a build, when there is
  # no such image: a release that is not byte-for-byte what homologation ran is
  # exactly what this process exists to prevent.
  promote:
    name: promote release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: read
      packages: write
      # `gh run list`, to wait for a master build of this commit still running.
      actions: read
    outputs:
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.promote.outputs.digest }}
    steps:
      # Full history: the tagged commit must be proven to be on master.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/compliance-ai" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The chart version is the tag without its `v`, and Helm only accepts
      # SemVer 2, so `v1.0` would fail at the very end; refuse it up front.
      - name: Check the tag
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tags are vMAJOR.MINOR.PATCH (e.g. v1.0.0, v1.2.0-rc.1); got $GITHUB_REF_NAME"
            exit 1
          fi

      # A release comes from master: that is what homologation deploys. An image
      # built from a feature branch also carries a `sha-` tag, and must not be
      # promotable just because someone tagged that branch.
      - name: Check the commit is on master
        id: commit
        run: |
          commit=$(git rev-parse HEAD)
          git fetch --no-tags --quiet origin master
          if ! git merge-base --is-ancestor "$commit" origin/master; then
            echo "::error::$GITHUB_REF_NAME points at $commit, which is not on master. Tag a commit master has built."
            exit 1
          fi
          echo "sha=$commit" >> "$GITHUB_OUTPUT"

      # Tagging right after a merge is normal, and master's build of that commit
      # may still be running; wait for it instead of failing. Missing image with
      # no build pending (e.g. a docs-only commit, which master does not build)
      # is an error that names what to do.
      - name: Find the image master published for this commit
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.image.outputs.ref }}
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          src="$REF:sha-$COMMIT"
          deadline=$((SECONDS + 120 * 60))
          until docker buildx imagetools inspect "$src" >/dev/null 2>&1; do
            pending=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow docker-image.yml --branch master \
              --commit "$COMMIT" --json status --jq '[.[] | select(.status != "completed")] | length')
            if [[ $pending == 0 ]]; then
              echo "::error::no image $src: master has not published one for $COMMIT and no build of it is running. Tag the latest commit master built (docs-only commits are not built), or re-run the master build."
              exit 1
            fi
            (( SECONDS < deadline )) || { echo "::error::master's build of $COMMIT did not publish $src within 120 minutes"; exit 1; }
            echo "waiting for master's build of $COMMIT ($pending run(s) in progress)"
            sleep 60
          done
          digest=$(docker buildx imagetools inspect "$src" --format '{{json .Manifest}}' | jq -r .digest)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::could not read the digest of $src"; exit 1; }
          echo "ref=$src" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # `--prefer-index=false` keeps the source manifest as it is. Without it a
      # single-manifest source is wrapped in a new index, i.e. a NEW digest,
      # which would defeat the point; the check after the push proves it held.
      - name: Promote
        id: promote
        env:
          REF: ${{ steps.image.outputs.ref }}
          DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$REF:$GITHUB_REF_NAME" "$REF@$DIGEST"
          promoted=$(docker buildx imagetools inspect "$REF:$GITHUB_REF_NAME" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ $promoted != "$DIGEST" ]]; then
            echo "::error::$REF:$GITHUB_REF_NAME resolves to $promoted, not the promoted $DIGEST"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Summarize
        run: |
          {
            echo '### Compliance AI release'
            echo
            echo "\`${{ steps.image.outputs.ref }}:$GITHUB_REF_NAME\` is the image master built for \`${{ steps.commit.outputs.sha }}\` (\`${{ steps.source.outputs.ref }}\`), promoted without a rebuild."
            echo
            echo 'Deploy by digest:'
            echo '```'
            echo "${{ steps.image.outputs.ref }}@${{ steps.promote.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The Helm chart, pinned to the digest `image` just published and smoke-tested
  # (master) or `promote` just tagged (a release). Only from master and from `v*`
  # tags: a feature branch image is not something a cluster should be able to
  # pull through a released chart.
  #
  # Versions: a `v1.2.3` tag publishes chart 1.2.3 over image tag v1.2.3;
  # master publishes `<Chart.yaml version>-master.<run number>` over
  # `sha-<commit>`, a prerelease that `helm install` only picks with `--devel`
  # or an explicit `--version`.
  #
  # Path: the organization's shared `ghcr.io/<owner>/charts/<chart>` namespace
  # (beside e.g. charts/comvertflow), not under this repository's name, so a
  # cluster pulls every company chart with one registry login.
  chart:
    name: publish helm chart
    needs: [image, promote]
    # Exactly one of the two runs per event; `!cancelled()` keeps the skipped one
    # from skipping this job, and an empty digest means the one that ran failed.
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
      && (needs.image.outputs.digest || needs.promote.outputs.digest) != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ${{ needs.promote.outputs.image || needs.image.outputs.image }}
      DIGEST: ${{ needs.promote.outputs.digest || needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: azure/setup-helm@v4
        with:
          version: v3.21.4

      - name: Resolve versions
        id: version
        run: |
          base=$(sed -n 's/^version: *//p' deploy/helm/compliance-ai/Chart.yaml)
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            app_version=$GITHUB_REF_NAME
          else
            version="$base-master.$GITHUB_RUN_NUMBER"
            app_version="sha-$GITHUB_SHA"
          fi
          {
            echo "version=$version"
            echo "app_version=$app_version"
            echo "registry=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          } >> "$GITHUB_OUTPUT"

      - name: Package
        run: >-
          deploy/helm/package.sh
          "${{ steps.version.outputs.version }}"
          "${{ steps.version.outputs.app_version }}"
          "$DIGEST"
          dist

      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin <<<"$GH_TOKEN"
          helm push dist/compliance-ai-*.tgz "${{ steps.version.outputs.registry }}"

      - name: Summarize
        run: |
          {
            echo '### Helm chart'
            echo
            echo "chart \`compliance-ai\` ${{ steps.version.outputs.version }} → image \`$IMAGE@$DIGEST\`"
            echo
            echo '```'
            echo "helm upgrade --install compliance-ai ${{ steps.version.outputs.registry }}/compliance-ai \\"
            echo "  --version ${{ steps.version.outputs.version }} -n compliance-ai --create-namespace -f my-values.yaml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
