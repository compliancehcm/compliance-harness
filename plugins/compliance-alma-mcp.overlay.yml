# Loader overlay: ALMA (Compliance HCM) as MCP tools in the user's workspace.
#
# The committed values point at production and at one machine's paths;
# `deploy/docker/entrypoint.sh` renders this row from the container environment
# instead.
#
# ALMA is called with the user's own SSO access token — the one Keycloak issued
# at the Compliance login — which the backend asks the gateway's token broker
# for. The broker's address and this backend's key arrive as environment
# variables set by compliance-tenancy, so this row only works inside a per-user
# backend; anywhere else it mounts no tools and says so in the log.
#
# One row, not two: the `@deepseek-ai/dsh-mcp-client` instance is mounted BY this
# plugin, pointed at its relay on this process's own webserver port, which is
# only known once that webserver is listening.
- insert:
    - id: alma-mcp
      name: '@compliance/dsh-alma-mcp'
      inject: [webServer]
      config:
        # ALMA's MCP endpoint; it accepts the Compliance SSO access token.
        mcpUrl: https://mcp.compliancehcm.com.br/mcp
        # Tools appear to the model as `mcp__alma__*`.
        serverName: alma
        # Where `@deepseek-ai/dsh-mcp-client` is resolved from: a directory whose
        # dependency graph declares it. `plugins/` is not a workspace member and
        # has no node_modules of its own.
        resolveMcpClientFrom: /home/lucas/dev/ai/compliance-harness/apps/cli
        # Ask the broker again this many seconds before the cached token's
        # expiry. Under 60: the gateway itself renews a token with less than
        # 60s left before handing it out.
        refreshSkewSeconds: 30
        # How long one ALMA tool call may take. The MCP SDK answers
        # `-32001 Request timed out` when this elapses, and its own default is
        # 60s — short for a query that goes looking through payroll history.
        # Raise it here; it is not the harness's timeout, it is this route's.
        toolCallTimeoutMs: 300000
