<!-- @dsCard group="Brand" viewport="700x200" name="Favicon" subtitle="assets/favicon.svg — quadrado azul-marinho rx 14, arco branco 9px e ponto âmbar" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Favicon</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--card);font-family:var(--font);color:var(--foreground)}.row{display:flex;align-items:flex-end;gap:28px}.item{display:flex;flex-direction:column;align-items:center;gap:8px}.item s{font-size:11px;color:var(--muted-foreground);text-decoration:none;font-variant-numeric:tabular-nums}.tab{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px 8px 0 0;background:var(--background);padding:8px 12px;font-size:12px;color:var(--muted-foreground);max-width:210px}.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note{font-size:12px;color:var(--muted-foreground);margin-top:16px;line-height:1.5}.note code{font-family:ui-monospace,monospace;font-size:11px;background:var(--muted);padding:1px 5px;border-radius:4px}</style></head><body>
<div class="row">
<div class="item"><img src="../assets/favicon.svg" width="64" height="64" alt="Favicon Compliance HCM"><s>64</s></div>
<div class="item"><img src="../assets/favicon.svg" width="32" height="32" alt=""><s>32</s></div>
<div class="item"><img src="../assets/favicon.svg" width="16" height="16" alt=""><s>16</s></div>
<div class="item"><div class="tab"><img src="../assets/favicon.svg" width="16" height="16" alt=""><span>Compliance HCM · Portal</span></div><s>aba do navegador</s></div>
<div class="item"><div style="width:64px;height:64px;border-radius:14px;background:var(--primary);display:flex;align-items:center;justify-content:center"><img src="../assets/favicon.svg" width="40" height="40" alt="" style="border-radius:9px"></div><s>sobre --primary</s></div>
</div>
<div class="note">Arquivo único: <code>assets/favicon.svg</code>. Cores fixas no SVG (<code>#2b4587</code>, <code>#ffffff</code>, <code>#f5a623</code>) — não recolorir por tema. Uso: <code>&lt;link rel="icon" href="assets/favicon.svg"&gt;</code>. Não esticar, não remover o quadrado de fundo nem aplicar sombra.</div>
</body></html>
