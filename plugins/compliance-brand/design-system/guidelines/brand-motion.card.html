<!-- @dsCard group="Brand" viewport="700x150" name="Motion & states" subtitle="fadeIn 6px em telas e modais; hover troca o fundo, sem escala" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--card);font-family:var(--font);color:var(--foreground)}.g{display:flex;flex-wrap:wrap;gap:10px}.sw{border-radius:8px;border:1px solid var(--border);overflow:hidden;width:104px}.sw i{display:block;height:44px}.sw b{display:block;font-size:11px;font-weight:600;padding:6px 8px 1px}.sw s{display:block;font-size:11px;color:var(--muted-foreground);padding:0 8px 7px;text-decoration:none;font-variant-numeric:tabular-nums}</style></head><body><style>@keyframes demoFade{0%,70%{opacity:0;transform:translateY(6px)}85%,100%{opacity:1;transform:none}}</style><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div style="animation:demoFade 2.6s ease infinite;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;font-size:13px">fadeIn .25s ease</div><div style="display:flex;gap:8px"><button style="background:var(--primary);color:var(--primary-foreground);border:none;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600">padrão</button><button style="background:var(--primary-hover);color:var(--primary-foreground);border:none;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600">hover</button><button style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:14px;font-weight:500">secundário</button><button style="background:var(--muted);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:14px;font-weight:500">hover</button></div><div style="font-size:11px;color:var(--muted-foreground);max-width:180px">Sem press state, sem bounce, sem transição de cor: só largura da sidebar anima (.2s).</div></div></body></html>
