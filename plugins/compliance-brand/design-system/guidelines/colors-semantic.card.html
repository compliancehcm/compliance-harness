<!-- @dsCard group="Colors" viewport="700x150" name="Semantic surfaces" subtitle="The aliases screens actually reference — never raw hex" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Semantic</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--card);font-family:var(--font);color:var(--foreground)}.g{display:flex;flex-wrap:wrap;gap:10px}.sw{border-radius:8px;border:1px solid var(--border);overflow:hidden;width:104px}.sw i{display:block;height:44px}.sw b{display:block;font-size:11px;font-weight:600;padding:6px 8px 1px}.sw s{display:block;font-size:11px;color:var(--muted-foreground);padding:0 8px 7px;text-decoration:none;font-variant-numeric:tabular-nums}</style></head><body><div class="g"><div class="sw"><i style="background:#fafafa"></i><b>--background</b><s>#fafafa</s></div><div class="sw"><i style="background:#ffffff"></i><b>--card</b><s>#ffffff</s></div><div class="sw"><i style="background:#f4f4f5"></i><b>--muted</b><s>#f4f4f5</s></div><div class="sw"><i style="background:#e4e4e7"></i><b>--border</b><s>#e4e4e7</s></div><div class="sw"><i style="background:#71717a"></i><b>--muted-foreground</b><s>#71717a</s></div><div class="sw"><i style="background:#52525b"></i><b>--secondary-foreground</b><s>#52525b</s></div><div class="sw"><i style="background:#09090b"></i><b>--foreground</b><s>#09090b</s></div><div class="sw"><i style="background:#18181b"></i><b>--primary</b><s>#18181b</s></div><div class="sw"><i style="background:#3f3f46"></i><b>--primary-hover</b><s>#3f3f46</s></div></div></body></html>
