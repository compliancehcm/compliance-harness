<!-- @dsCard group="Colors" viewport="700x150" name="Status pills" subtitle="Soft tint + dark text of the same hue; 999px radius, 12px/600" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--card);font-family:var(--font);color:var(--foreground)}.g{display:flex;flex-wrap:wrap;gap:10px}.sw{border-radius:8px;border:1px solid var(--border);overflow:hidden;width:104px}.sw i{display:block;height:44px}.sw b{display:block;font-size:11px;font-weight:600;padding:6px 8px 1px}.sw s{display:block;font-size:11px;color:var(--muted-foreground);padding:0 8px 7px;text-decoration:none;font-variant-numeric:tabular-nums}</style></head><body><div class="g" style="align-items:center;gap:14px"><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span style="background:#dcfce7;color:#166534;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600">Aprovada</span><span style="font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums">#dcfce7 / #166534</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span style="background:#fee2e2;color:#991b1b;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600">Rejeitada</span><span style="font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums">#fee2e2 / #991b1b</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span style="background:#fef9c3;color:#854d0e;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600">Aguardando aprovação</span><span style="font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums">#fef9c3 / #854d0e</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span style="background:#dbeafe;color:#1e40af;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600">Férias</span><span style="font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums">#dbeafe / #1e40af</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span style="background:#f3e8ff;color:#6b21a8;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600">Vaga</span><span style="font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums">#f3e8ff / #6b21a8</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span style="background:var(--muted);color:var(--secondary-foreground);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600">Encerrada</span><span style="font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums">var(--muted) / var(--secondary-foreground)</span></div></div></body></html>
