<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--card);font-family:var(--font);color:var(--foreground)}.g{display:flex;flex-wrap:wrap;gap:10px}.sw{border-radius:8px;border:1px solid var(--border);overflow:hidden;width:104px}.sw i{display:block;height:44px}.sw b{display:block;font-size:11px;font-weight:600;padding:6px 8px 1px}.sw s{display:block;font-size:11px;color:var(--muted-foreground);padding:0 8px 7px;text-decoration:none;font-variant-numeric:tabular-nums}</style></head><body><div style="display:flex;gap:16px;align-items:center;background:var(--background);padding:16px;border-radius:12px"><div style="text-align:center"><div style="width:130px;height:56px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:none"></div><div style="font-size:11px;font-weight:600;margin-top:8px">nenhuma</div><div style="font-size:11px;color:var(--muted-foreground)">0 (cartão)</div></div><div style="text-align:center"><div style="width:130px;height:56px;background:var(--card);border:none;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.08)"></div><div style="font-size:11px;font-weight:600;margin-top:8px">segmento</div><div style="font-size:11px;color:var(--muted-foreground)">0 1px 2px rgba(0,0,0,.08)</div></div><div style="text-align:center"><div style="width:130px;height:56px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.15)"></div><div style="font-size:11px;font-weight:600;margin-top:8px">popover</div><div style="font-size:11px;color:var(--muted-foreground)">0 8px 30px rgba(0,0,0,.15)</div></div><div style="text-align:center"><div style="width:130px;height:56px;background:var(--primary);border:none;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)"></div><div style="font-size:11px;font-weight:600;margin-top:8px">toast</div><div style="font-size:11px;color:var(--muted-foreground)">0 8px 24px rgba(0,0,0,.25)</div></div></div></body></html>
