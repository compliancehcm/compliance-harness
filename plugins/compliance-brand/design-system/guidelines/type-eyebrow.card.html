<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Eyebrow</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--card);font-family:var(--font);color:var(--foreground)}.g{display:flex;flex-wrap:wrap;gap:10px}.sw{border-radius:8px;border:1px solid var(--border);overflow:hidden;width:104px}.sw i{display:block;height:44px}.sw b{display:block;font-size:11px;font-weight:600;padding:6px 8px 1px}.sw s{display:block;font-size:11px;color:var(--muted-foreground);padding:0 8px 7px;text-decoration:none;font-variant-numeric:tabular-nums}</style></head><body><div style="display:flex;flex-direction:column;gap:14px"><div style="display:grid;grid-template-columns:1.1fr 1.8fr .7fr .7fr;gap:12px;padding:10px 16px;background:var(--background);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.05em"><div>Data</div><div>Batidas</div><div>Previsto</div><div>Saldo</div></div><div style="display:flex;gap:24px;align-items:center"><div style="font-size:11px;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.06em">Tema</div><div style="background:var(--primary);border-radius:8px;padding:8px 12px"><span style="font-size:13px;color:var(--primary-muted-foreground);text-transform:uppercase;letter-spacing:.08em;font-weight:600">Registro de ponto</span></div></div></div></body></html>
