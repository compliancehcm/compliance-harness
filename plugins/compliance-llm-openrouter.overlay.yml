# Loader overlay: OpenRouter as the deployment's LLM, over the pi-ai adapter.
#
# Composition, not settings. The base bundle mounts `llm-pi-ai` dormant and
# points `agent-default-model` at the native DeepSeek route; a `llm-pi-ai:`
# section in a user's own `settings.yaml` would override this per user, which is
# exactly why the deployment default belongs here instead: under tenancy every
# user starts from a fresh `$DSH_HOME` with no settings document, so a default
# written through the Models page reaches only the harness that wrote it — the
# gateway's own, which serves nobody.
#
# No secret is inlined. `apiKeyEnv` is a credential REFERENCE resolved per
# request; the value lives in the credential store (or the root `.env`), and the
# tenancy row must forward that variable name into each backend or the reference
# resolves to nothing inside the jail.
#
# `openrouter` is a route pi-ai ships, so the endpoint and the wire protocol come
# from its installed catalog. Since pi-ai 1.3 (dsh 0.2.2) that catalog also
# describes both models below — capacities, cost, and reasoning with the levels
# off / high / xhigh sent in OpenRouter's own format. A `models` list REPLACES the
# route's catalog, which is why it is here: it narrows the picker to these two
# out of the route's hundreds. Every field an entry leaves unset is taken from
# the catalog entry with the same id (packages/llm/llm-pi-ai/README.md), so the
# context windows and the reasoning levels are the catalog's, not restated.
#
# `maxTokens` is deliberately set, and NOT to the catalog's 943,717 / 384,000: a
# CONFIGURED value becomes the default output cap of every request that names
# none, and asking for that much output on each turn is a deployment choice
# nobody made. It is a sane per-request default; a caller needing more asks.
#
# `name` is set only for the picker label; the catalog's reads
# "DeepSeek: DeepSeek V4 Flash 0423".
#
# The catalog also carries `deepseek/deepseek-v4.1-flash`, which accepts images
# where these two are text-only. Adding it is a product decision, not a default.
- id: llm-pi-ai
  config:
    providers:
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
        models:
          - id: deepseek/deepseek-v4-flash
            name: DeepSeek V4 Flash
            maxTokens: 32768
          - id: deepseek/deepseek-v4-pro
            name: DeepSeek V4 Pro
            maxTokens: 32768

# The default for every Agent created without an explicit selection. Flash is the
# default and Pro is the other option in the picker; a patch replaces a row's
# whole config, so both fields are stated.
- id: agent-default-model
  config:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
