# The composition an ordinary user's backend gets.
#
# This is the cosmetic half of the administrative fence: it removes the buttons.
# The fence itself is the gateway's request policy (plugins/sso-auth/src/policy.ts),
# which refuses the endpoints behind them — omitting a row here does not remove
# an RPC, and a user who crafts the call directly must still be refused.
#
# Omitting these rows is structurally clean: `settings.section` and
# `settings.general.item` are declared by ui-settings-general, which always
# registers the General section itself, so nothing is left with a dangling slot.
#
# `ui-settings` is NOT disabled and must not be: ui-theme, locale and
# ui-conversation all inject `settingsScope`, so removing it would take
# Appearance, Language and the composer with it.

# Models and provider credentials.
- id: ui-settings-models
  disabled: true

# Plugin configuration pages (bash policy, agent-loop limits, subagents, web
# search key). Since dsh 0.2.2 each is its own row registering a page in
# Settings and on the Plugins page; the gateway refuses the namespaces they
# write (`shell`, `agent-loop`, …), so the pages go with them.
- id: ui-settings-shell
  disabled: true
- id: ui-settings-agent-loop
  disabled: true
- id: ui-settings-subagent
  disabled: true
- id: ui-settings-web-search
  disabled: true

# Settings → General: whether Session logs are uploaded with DeepSeek API
# requests. A data-governance choice for the deployment, not for each user.
- id: ui-settings-session-log
  disabled: true

# The sidebar Plugins page, which installs, enables and removes the profile's
# bundles. The gateway refuses the `pluginManager` namespace behind it.
- id: ui-plugin-manager
  disabled: true

# Agent presets: the section, and the per-session picker chip. A preset carries
# the same trust as shell access, so choosing one is an administrative act.
- id: ui-agent-preset
  disabled: true

# Permission presets: these set the sandbox mode, and the outer namespace makes
# escalation moot for path confinement — but leaving the control visible would
# suggest a ceiling the user can raise, which they cannot.
#
# The row id is `ui-permission`, NOT `ui-permission-presets` (that is the package
# name). A patch targeting an id no row carries is silently ignored, so the
# original typo here disabled nothing and the control stayed visible — verify
# ids against packages/bundle/web-app/cordis.patch.yml when editing this file.
- id: ui-permission
  disabled: true

# The dynamic Cordis runner: it approves and evaluates plugin code defined at
# runtime. The browser half and its UI go, so nothing polls the endpoints the
# gateway refuses (`dynamicCordisRunner`) and the console stays clean.
#
# `cordis-host-runner` must STAY ENABLED. Besides the dynamic runner it provides
# `cordisInspect`, which `tool-cordis` injects, and `tool-cordis` sits in the
# `standard` and `cordis` agent presets. Since dsh 0.2.3 a preset with one
# pending row is refused whole (`agent-preset/invalid`), so disabling it broke
# every ordinary user's sessions, old and new. Its RPC surface is the
# `dynamicCordisRunner` namespace, which the gateway refuses to non-admins, and
# only the disabled client half calls it. tests/role-presets.mjs guards this.
- id: cordis-client-runner
  disabled: true
- id: ui-cordis
  disabled: true

# The native directory chooser opens a dialog on the host machine, outside the
# user's tree. The browse picker stays, rooted at the user's HOME.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

# Connector accounts, whose endpoints the gateway refuses to a non-admin
# (`connectorAccounts`): connector OAuth cannot complete behind the gate. The row
# goes so the UI does not offer it and nothing polls refused endpoints. The
# personal DeepSeek account rows are off for every role, in
# plugins/compliance-hardening.overlay.yml.
- id: ui-connector-account
  disabled: true

# The conversation's view tabs. With both rows gone only the Chat view is left,
# and the header draws no tab row at all for a single view.
#
# `ui-trajectory` is the "Trajetória" tab: the raw run log, a developer view.
# Both halves go; the host half's only service, `sessionToolResults`, is the
# read-only `toolResults` inspection that this view alone reads.
- id: ui-trajectory
  disabled: true
# `entry-customization` fills the "…" More menu beside the tabs (and the same
# menu in the right sidebar). Its rows start a session on the `cordis` agent
# preset to build a custom view, which the gateway refuses to a non-admin
# (`session/create` with an agentPreset), so for an ordinary user the menu only
# leads to an error. With no rows the right sidebar's "Mais ferramentas" card,
# which lists the same menu, is not drawn either.
- id: entry-customization
  disabled: true

# The interactive terminal: the right sidebar's "Novo terminal" card, its panel
# and Ctrl+` (`ui-sidebar-terminal`), and the host controller behind them
# (`terminal-controller`, Remote namespace `terminal`). The host row goes too,
# not only the button: `terminal/attach` is a stream over /api/remote.mux, which
# the gateway policy does not inspect, so the endpoints must not exist at all.
# The gateway also refuses the `terminal` namespace as a second layer. Nothing
# in any shipped agent preset injects `terminalController` (only the
# experimental terminal-panel does), so no preset loses a row.
- id: ui-sidebar-terminal
  disabled: true
- id: terminal-controller
  disabled: true
